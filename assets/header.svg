<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Tiago Iesbick — Technology Lead and Full-Stack Engineer</title>
  <desc id="d">AI agents and data systems for finance and public pensions. 31,000+ pension fund members, R$5.5B in assets under management, 15+ years across software and finance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5eead4" fill-opacity="0.22"/>
    </pattern>
    <mask id="m">
      <rect x="600" y="0" width="600" height="250" fill="url(#fade)"/>
    </mask>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="380" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .edge { stroke: #2dd4bf; stroke-opacity: 0.45; stroke-width: 1.5; fill: none; stroke-dasharray: 4 6; animation: flow 4s linear infinite; }
      .node { fill: #0f1d2e; stroke: #5eead4; stroke-width: 2; }
      .pulse { fill: none; stroke: #2dd4bf; stroke-width: 3; transform-origin: 1036px 176px; animation: pulse 2.8s ease-out infinite; }
      .pulse.b { animation-delay: 1.4s; }
      .core { transform-origin: 1036px 176px; animation: breathe 2.8s ease-in-out infinite; }
      .packet { fill: #ccfbf1; filter: url(#soft); }
      @keyframes flow { to { stroke-dashoffset: -100; } }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(3.4); opacity: 0; } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .edge, .pulse, .core { animation: none; } .pulse, .packet { display: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect x="600" y="0" width="600" height="250" fill="url(#dots)" mask="url(#m)"/>

    <!-- agent graph -->
    <g>
      <path class="edge" d="M880 92 L984 66"/>
      <path class="edge" d="M984 66 L1096 104"/>
      <path class="edge" d="M880 92 L926 170"/>
      <path class="edge" d="M984 66 L926 170"/>
      <path class="edge" d="M984 66 L1036 176"/>
      <path class="edge" d="M1096 104 L1036 176"/>
      <path class="edge" d="M926 170 L1036 176"/>
      <path class="edge" d="M1036 176 L1128 214"/>
      <path class="edge" d="M926 170 L858 218"/>
      <circle class="node" cx="880" cy="92" r="7"/>
      <circle class="node" cx="984" cy="66" r="9"/>
      <circle class="node" cx="1096" cy="104" r="7"/>
      <circle class="node" cx="926" cy="170" r="8"/>
      <circle class="node" cx="1128" cy="214" r="6"/>
      <circle class="node" cx="858" cy="218" r="5"/>
      <circle class="packet" r="4.5" opacity="0">
        <animateMotion path="M880 92 L984 66 L1036 176" dur="2.6s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle class="packet" r="4.5" opacity="0">
        <animateMotion path="M858 218 L926 170 L1036 176 L1128 214" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle class="packet" r="4.5" opacity="0">
        <animateMotion path="M1096 104 L1036 176 L926 170" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle class="pulse" cx="1036" cy="176" r="11"/>
      <circle class="pulse b" cx="1036" cy="176" r="11"/>
      <circle class="core" cx="1036" cy="176" r="11" fill="#2dd4bf"/>
    </g>

    <!-- text -->
    <text class="mono" x="64" y="86" font-size="15" letter-spacing="3" fill="#5eead4">TECHNOLOGY LEAD · FULL-STACK ENGINEER</text>
    <text class="sans" x="62" y="162" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">Tiago Iesbick</text>
    <text class="sans" x="64" y="208" font-size="22" fill="#9fb0c5">AI agents and data systems for finance and public pensions.</text>

    <line x1="64" y1="258" x2="1136" y2="258" stroke="#22324a" stroke-width="1"/>

    <g class="sans">
      <text x="64" y="308" font-size="30" font-weight="700" fill="#f8fafc">31,000+</text>
      <text x="64" y="336" font-size="15" fill="#8a9bb2">pension fund members</text>

      <text x="430" y="308" font-size="30" font-weight="700" fill="#f8fafc">R$5.5B</text>
      <text x="430" y="336" font-size="15" fill="#8a9bb2">assets under management</text>

      <text x="796" y="308" font-size="30" font-weight="700" fill="#f8fafc">15+ years</text>
      <text x="796" y="336" font-size="15" fill="#8a9bb2">across software and finance</text>
    </g>
  </g>
</svg>
